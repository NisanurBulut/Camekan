<carousel>
  @for (slide of slides; track slide.src) {
    <slide>
      <div class="slide-frame">
        <img [ngSrc]="slide.src" [alt]="slide.alt | translate" fill [priority]="$first" />
      </div>
    </slide>
  }
</carousel>
<div class="featured">
  <div class="d-flex justify-content-center pt-4">
    <h1>{{ 'HOME.READY' | translate: { name: appName } }}</h1>
  </div>
</div>
