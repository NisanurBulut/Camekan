<div class="container ml-5 mt-5">
  @if (order) {
    <div class="row">
      <div class="col-8">
        <cmk-basket-summary
          [isBasket]="false"
          [isOrder]="true"
          [items]="order.orderItems"
        ></cmk-basket-summary>
      </div>
      <div class="col-4">
        <cmk-order-total
          [shippingPrice]="order.shippingPrice"
          [subTotal]="order.subtotal"
        [total]="order.total"></cmk-order-total>
      </div>
    </div>
  }
</div>
