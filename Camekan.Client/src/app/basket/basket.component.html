<div class="container mt-4">
  @if ((this.basket$ | async) === null) {
    <section class="empty-state" aria-labelledby="basket-empty-title">
      <svg class="empty-state__art" viewBox="0 0 220 170" aria-hidden="true" focusable="false">
        <circle class="art-blob" cx="105" cy="92" r="72" />
        <path class="art-handle" d="M72 86 Q105 34 138 86" />
        <path class="art-basket" d="M54 86 H156 L144 140 Q142 148 134 148 H76 Q68 148 66 140 Z" />
        <rect class="art-rim" x="48" y="78" width="114" height="14" rx="7" />
        <path class="art-slats" d="M84 102 V134 M105 102 V134 M126 102 V134" />
        <g class="art-book">
          <rect class="art-book-cover" x="152" y="26" width="26" height="34" rx="3" />
          <rect class="art-book-spine" x="152" y="26" width="6" height="34" rx="2" />
        </g>
      </svg>

      <div>
        <h2 id="basket-empty-title" class="empty-state__title">{{ 'BASKET.EMPTY' | translate }}</h2>
        <p class="empty-state__text">{{ 'BASKET.EMPTY_TEXT' | translate }}</p>
        <div class="empty-state__actions">
          <a routerLink="/shop" class="btn es-btn es-btn--primary">
            <i class="fa fa-book mr-2" aria-hidden="true"></i>{{ 'BASKET.GO_SHOP' | translate }}
          </a>
        </div>
      </div>
    </section>
  }

  @if (this.basket$ | async; as basket) {
    <div>
      <div class="pb-5">
        <div class="container">
          <div class="row">
            <div class="col-12 py-5 mb-1">
              <cmk-basket-summary
                [isBasket]="true"
                [isOrder]="false"
                (decrement)="decrementItemQuantity($event)"
                (increment)="incrementItemQuantity($event)"
                (remove)="removeBasketItem($event)"
                [items]="(basket$ | async).items">
              </cmk-basket-summary>
            </div>
          </div>
          <div class="row">
            <div class="col-12 col-md-6 offset-md-6">
              @if ((basketTotal$ | async)) {
                <cmk-order-total
                  [shippingPrice]="(basketTotal$ | async).shipping"
                  [subTotal]="(basketTotal$ | async).subTotal"
                [total]="(basketTotal$ | async).total"></cmk-order-total>
              }
              <a routerLink="/checkout" class="btn btn-block btn-lg btn-cta">
                <i class="fa fa-lock mr-2" aria-hidden="true"></i>{{ 'CHECKOUT.COMPLETE_ORDER' | translate }}
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
