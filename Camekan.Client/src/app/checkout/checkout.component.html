<div class="container mt-5">
  <div class="row">
      <div class="col-8">
          <app-stepper [linearModelSelected]="true" #appStepper>
              <cdk-step [label]="'CHECKOUT.STEP_ADDRESS' | translate" [completed]="(checkoutForm.get('addressForm')).valid">
                  <app-checkout-address [checkoutForm]="checkoutForm"></app-checkout-address>
              </cdk-step>
              <cdk-step [label]="'CHECKOUT.STEP_DELIVERY' | translate" [completed]="(checkoutForm.get('deliveryForm')).valid">
                <app-checkout-delivery [checkoutForm]="checkoutForm"></app-checkout-delivery>
            </cdk-step>
            <cdk-step [label]="'ORDER.TITLE' | translate">
              <app-checkout-review [appStepper]="appStepper"></app-checkout-review>
            </cdk-step>
            <cdk-step [label]="'CHECKOUT.STEP_PAYMENT' | translate" [completed]="(checkoutForm.get('paymentForm')).valid">
                <app-checkout-payment
                [checkoutForm]="checkoutForm"></app-checkout-payment>
            </cdk-step>
          </app-stepper>
      </div>
      <div class="col-4">
        <app-order-total
        *ngIf="(basketTotal$ | async)"
        [shippingPrice]="(basketTotal$ | async).shipping"
        [subTotal]="(basketTotal$ | async).subTotal"
        [total]="(basketTotal$ | async).total"></app-order-total>
      </div>
  </div>
</div>
