<div class="container mt-5">
  <div class="row">
    <div class="col-8">
      <cmk-stepper [linearModelSelected]="true" #appStepper>
        <cdk-step [label]="'CHECKOUT.STEP_ADDRESS' | translate" [completed]="(checkoutForm.get('addressForm')).valid">
          <cmk-checkout-address [checkoutForm]="checkoutForm"></cmk-checkout-address>
        </cdk-step>
        <cdk-step [label]="'CHECKOUT.STEP_DELIVERY' | translate" [completed]="(checkoutForm.get('deliveryForm')).valid">
          <cmk-checkout-delivery [checkoutForm]="checkoutForm"></cmk-checkout-delivery>
        </cdk-step>
        <cdk-step [label]="'ORDER.TITLE' | translate">
          <cmk-checkout-review [appStepper]="appStepper"></cmk-checkout-review>
        </cdk-step>
        <cdk-step [label]="'CHECKOUT.STEP_PAYMENT' | translate" [completed]="(checkoutForm.get('paymentForm')).valid">
          <cmk-checkout-payment
          [checkoutForm]="checkoutForm"></cmk-checkout-payment>
        </cdk-step>
      </cmk-stepper>
    </div>
    <div class="col-4">
      @if ((basketTotal$ | async)) {
        <cmk-order-total
          [shippingPrice]="(basketTotal$ | async).shipping"
          [subTotal]="(basketTotal$ | async).subTotal"
        [total]="(basketTotal$ | async).total"></cmk-order-total>
      }
    </div>
  </div>
</div>
