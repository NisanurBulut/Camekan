<div class="mt-4" [formGroup]="checkoutForm">
  @if (stripeLoadFailed()) {
    <div class="alert alert-danger" role="alert">{{ 'CHECKOUT.PAYMENT_LOAD_FAILED' | translate }}</div>
  }
  <div class="row">
    <div class="form-group col-12" formGroupName="paymentForm">
      <cmk-text-input
        [label]="'CHECKOUT.NAME_ON_CARD' | translate"
        formControlName="nameOnCard"
      ></cmk-text-input>
    </div>
    <div class="form-group col-6">
      <div #cardNumber class="form-control py-3"></div>
      @if (cardErrors()) {
        <span class="text-danger">{{ cardErrors() }}</span>
      }
    </div>
    <div class="form-group col-3">
      <div #cardExpiry class="form-control py-3"></div>
      @if (cardErrors()) {
        <span class="text-danger">{{ cardErrors() }}</span>
      }
    </div>
    <div class="form-group col-3">
      <div #cardCvc class="form-control py-3"></div>
      @if (cardErrors()) {
        <span class="text-danger">{{ cardErrors() }}</span>
      }
    </div>
  </div>
</div>
<div class="d-flex justify-content-between align-items-center mb-5 mt-5">
  <button type="button" class="btn btn-back" cdkStepperPrevious>
    <i class="fa fa-angle-left mr-2" aria-hidden="true"></i>{{ 'CHECKOUT.BACK' | translate }}
  </button>
  <button
    [disabled]="
      loading() ||
      checkoutForm.get('paymentForm').invalid ||
      !cardExpiryValid() ||
      !cardCvcValid() ||
      !cardNumberValid()
    "
    class="btn btn-lg btn-cta"
    (click)="submitOrder()"
    >
    @if (loading()) {
      <i class="fa fa-spinner fa-spin mr-2" aria-hidden="true"></i>
    } @else {
      <i class="fa fa-lock mr-2" aria-hidden="true"></i>
    }
    {{ 'CHECKOUT.COMPLETE_ORDER' | translate }}
  </button>
</div>
