# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Camekan.Client

    strategy:
      matrix:
        node-version: [22]
        # Angular 21 wants CLI Node^20.19 ||| ^22.12 ||| >=24. There is Node 20.20.2 in the local. Node 22 (LTS) will be used in CI.
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: Camekan.Client/package-lock.json
    - run: npm ci
    - run: cp src/environments/stripe-key.example.ts src/environments/stripe-key.ts
    - run: npm run lint
    - run: npm test -- --no-watch
    - run: npm run build
  label-hotfix:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label hotfix PR
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'hotfix')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels -f "labels[]=bug"
      - name: Label dev PR
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'dev')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels -f "labels[]=enhancement"
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the next tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(git tag --list 'v.*' --sort=-v:refname | head -n 1)
          IFS=. read -r _ a b c d <<< "$last"

          # ⭐ by Developerella 💃<br/>
          # The pull request that created this commit: its labels and description.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0]')
          labels=$(jq -r '.labels[].name' <<< "$pr")
          jq -r '.body // ""' <<< "$pr" > notes.md

          if grep -qx enhancement <<< "$labels"; then
            c=$((c + 1)); d=0
          else
            d=$((d + 1))
          fi

          gh release create "v.$a.$b.$c.$d" --target "$GITHUB_SHA" --notes-file notes.md --generate-notes


        

